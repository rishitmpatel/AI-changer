[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-switch"
version = "0.1.0"
description = "Move your AI assistant memory (and optionally chat history) between ChatGPT, Claude, Gemini, Grok, Copilot, Perplexity, Meta AI, DeepSeek and Mistral Le Chat."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
clipboard = ["pyperclip>=1.8"]
all = ["playwright>=1.45", "pyperclip>=1.8"]
dev = ["pytest>=8", "playwright>=1.45", "pyperclip>=1.8", "jsonschema>=4"]

[project.scripts]
ai-switch = "ai_switch.cli:main"

[tool.setuptools.packages.find]
include = ["ai_switch*"]

[tool.setuptools.package-data]
ai_switch = ["selectors/*.yaml", "schema/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Playwright + Chromium (skipped when unavailable)"]
