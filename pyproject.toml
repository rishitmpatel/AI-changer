[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-switch"
version = "1.0.0"
description = "Move your AI assistant memory (and optionally chat history) between ChatGPT, Claude, Gemini, Grok, Copilot, Perplexity, Meta AI, DeepSeek and Mistral Le Chat."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0", "websocket-client>=1.6"]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
clipboard = ["pyperclip>=1.8"]
all = ["playwright>=1.45", "pyperclip>=1.8"]
app = ["playwright>=1.45", "pyperclip>=1.8", "pywebview>=5.0"]
build = ["playwright>=1.45", "pyperclip>=1.8", "pywebview>=5.0", "pyinstaller>=6.6", "pyinstaller-hooks-contrib>=2024.6"]
dev = ["pytest>=8", "playwright>=1.45", "pyperclip>=1.8", "jsonschema>=4", "pywebview>=5.0", "Pillow>=10"]

[project.scripts]
ai-switch = "ai_switch.cli:main"

[project.gui-scripts]
ai-switch-app = "ai_switch.desktop.main:main"

[tool.setuptools.packages.find]
include = ["ai_switch*"]

[tool.setuptools.package-data]
ai_switch = ["selectors/*.yaml", "schema/*.json", "web/*.html", "web/app/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Playwright + Chromium (skipped when unavailable)"]
